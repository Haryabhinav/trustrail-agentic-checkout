services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MANDATE_MAX_SPEND_INR: ${MANDATE_MAX_SPEND_INR:-5000}
      MANDATE_ALLOWED_CATEGORIES: ${MANDATE_ALLOWED_CATEGORIES:-electronics,groceries,office-supplies}
      DATABASE_URL: sqlite:////data/trustrail.db
    volumes:
      - trustrail_db:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  trustrail_db:
